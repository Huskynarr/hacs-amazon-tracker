[project]
name = "hacs-amazon-tracker"
version = "1.2.0"
description = "HACS custom component for Home Assistant that tracks Amazon packages via IMAP email parsing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Huskynarr", email = "admin@huskynarr.de" }]
keywords = ["home-assistant", "hacs", "amazon", "imap", "package-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Home Assistant",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "aioimaplib>=1.1.0",
    "voluptuous>=0.13.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Huskynarr/hacs-amazon-tracker"
Repository = "https://github.com/Huskynarr/hacs-amazon-tracker"
Issues = "https://github.com/Huskynarr/hacs-amazon-tracker/issues"
Changelog = "https://github.com/Huskynarr/hacs-amazon-tracker/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PERF", # perflint
]
ignore = [
    "BLE001",   # blind except — intentional for IMAP/email error handling
    "DTZ005",   # datetime.now() without tz — HA manages timezone context
    "DTZ011",   # date.today() — HA manages timezone context
    "S110",     # try-except-pass — intentional for logout cleanup
    "SIM105",   # contextlib.suppress — try/except/pass is clearer for async cleanup
    "SIM108",   # ternary operator — if/else is clearer for conditional assignment
    "E501",     # line too long — handled case by case
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true
